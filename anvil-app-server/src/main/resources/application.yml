server:
  port: 7788

anvil:
  protocol-version: "1.0"
  max-steps-default: 40
  compact-threshold-tokens: 120000
  context-target-tokens: 80000
  context-keep-recent: 24
  tool-content-max-chars: 16000
  approval-timeout-ms: 1800000
  sandbox:
    tier: workspace_write
    shell-timeout-ms: 30000
  policy:
    auto-approve-patch-tools: true
  verify:
    auto-after-write: false
    auto-compile-after-write: true
    command-template: "mvn -q test -pl {module} -am"
    timeout-ms: 90000
    inject-failures: true
    force-fix-on-failure: true
  index:
    auto-warm: true
  loop:
    parallel-read-tools: true
    parallel-writes: true
    explore-sub-agent: true
    planner-required: true
    explore-max-steps: 6
  terminal:
    enabled: true
    max-sessions-per-thread: 3
    max-output-lines: 2000
    job-timeout-ms: 300000
  memory:
    db-path: "${user.home}/.anvil/memory.db"
  model:
    provider: scripted
    model-id: scripted:read-add
    base-url: https://api.openai.com/v1
    api-key-env: OPENAI_API_KEY
    routing:
      enabled: true
      explore: deepseek:deepseek-chat
      edit: deepseek:deepseek-chat
      plan: deepseek:deepseek-reasoner
  editor:
    diagnostics-on-save: true
  deepseek:
    base-url: https://api.deepseek.com/v1
    api-key-env: DEEPSEEK_API_KEY
    model-id: deepseek-chat
  mcp:
    allowlist:
      - junit
      - github
      - checkstyle
    builtin-stubs: true
    rpc-timeout-ms: 30000
